<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0e1117; height: 100%; overflow: hidden; }
  .player-root { position: relative; width: 100%; height: 100%; }
  .video-js {
    width: 100%; height: 100%; background: #000;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  /* ── Title ─────────────────────────────────────────── */
  .title-bar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 2;
    padding: 10px 16px;
    background: linear-gradient(to bottom, rgba(0,0,0,.7), transparent);
    color: #eee; font-size: 14px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    pointer-events: none; transition: opacity .3s;
  }
  .video-js.vjs-user-inactive.vjs-playing .title-bar { opacity: 0; }

  /* ── Progress bar — separate row above control bar ─── */
  .progress-row {
    position: absolute; bottom: 36px; left: 0; right: 0; z-index: 3;
    height: 12px; cursor: pointer;
    background: rgba(0,0,0,.4);
  }
  .progress-row:hover { height: 16px; bottom: 36px; }
  .progress-track {
    position: absolute; top: 50%; left: 0; right: 0;
    height: 4px; transform: translateY(-50%);
    background: rgba(255,255,255,.15); border-radius: 2px;
  }
  .progress-row:hover .progress-track { height: 6px; }
  .progress-buffered {
    position: absolute; top: 0; left: 0; height: 100%;
    background: rgba(1,180,228,.2); border-radius: 2px;
  }
  .progress-filled {
    position: absolute; top: 0; left: 0; height: 100%;
    background: #01b4e4; border-radius: 2px;
  }
  .progress-dot {
    position: absolute; top: 50%; width: 12px; height: 12px;
    background: #01b4e4; border-radius: 50%;
    transform: translate(-50%, -50%);
    opacity: 0; transition: opacity .15s;
  }
  .progress-row:hover .progress-dot { opacity: 1; }

  /* ── Control bar — compact single row ──────────────── */
  .ctrl-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 36px; z-index: 3;
    background: rgba(13,37,63,.92);
    display: flex; align-items: center;
    padding: 0 4px; gap: 2px;
    transition: opacity .3s;
  }
  .video-js.vjs-user-inactive.vjs-playing ~ .ctrl-bar { opacity: 0; }
  .video-js.vjs-user-inactive.vjs-playing ~ .progress-row { opacity: 0; }

  .ctrl-bar .cb { /* base for all control-bar items */
    flex-shrink: 0; display: flex; align-items: center;
    color: #ccc; cursor: pointer; padding: 0 5px;
    height: 36px; font-size: 13px;
    white-space: nowrap; user-select: none;
  }
  .ctrl-bar .cb:hover { color: #01b4e4; }
  .ctrl-bar .cb svg { width: 18px; height: 18px; fill: currentColor; }
  .ctrl-bar .spacer { flex: 1 1 0; min-width: 4px; }
  .ctrl-bar .time {
    font-size: 12px; color: #aaa; padding: 0 4px; cursor: default;
  }

  /* ── Small text buttons ────────────────────────────── */
  .cb-txt { font-size: 11px; font-weight: 600; padding: 0 4px; }

  /* ── Dropdown pill (audio / quality / speed) ───────── */
  .pill {
    position: relative; font-size: 11px; font-weight: 500;
    padding: 2px 6px; border-radius: 4px;
    background: rgba(255,255,255,.08);
  }
  .pill::after { content: ' ▾'; font-size: 8px; opacity: .5; }
  .pill-dropdown {
    display: none; position: absolute; bottom: 36px; right: 0;
    background: rgba(13,37,63,.97); border: 1px solid #1a3a5a;
    border-radius: 6px; min-width: 110px; z-index: 20;
    max-height: 260px; overflow-y: auto;
    box-shadow: 0 -4px 16px rgba(0,0,0,.5);
  }
  .pill.open .pill-dropdown { display: block; }
  .pill-dropdown .pd-item {
    padding: 8px 14px; cursor: pointer; color: #ccc; font-size: 13px;
    white-space: nowrap;
  }
  .pill-dropdown .pd-item:hover { background: rgba(1,180,228,.2); color: #fff; }
  .pill-dropdown .pd-item.active { color: #01b4e4; font-weight: 600; }
  .pill-dropdown .pd-header {
    padding: 6px 14px; color: #888; font-size: 10px;
    text-transform: uppercase; font-weight: 700; letter-spacing: .5px;
    border-bottom: 1px solid rgba(255,255,255,.06);
  }

  /* ── Next episode overlay ──────────────────────────── */
  .next-ep-overlay {
    position: absolute; bottom: 66px; right: 16px; z-index: 4;
    background: rgba(13,37,63,.95); border: 1px solid rgba(1,180,228,.35);
    border-radius: 10px; padding: 14px 18px;
    max-width: 320px; min-width: 200px;
    backdrop-filter: blur(10px); animation: neoSlide .3s ease-out;
    box-shadow: 0 4px 24px rgba(0,0,0,.5);
  }
  @keyframes neoSlide {
    from { transform: translateX(110%); opacity: 0; }
    to   { transform: translateX(0);    opacity: 1; }
  }
  .next-ep-overlay .neo-lbl { color: #01b4e4; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
  .next-ep-overlay .neo-ttl { color: #fff; font-size: 13px; font-weight: 500; line-height: 1.4; margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .next-ep-overlay .neo-acts { display: flex; gap: 8px; align-items: center; }
  .neo-go { background: #01b4e4; color: #fff; border: none; border-radius: 6px; padding: 6px 16px; cursor: pointer; font-size: 12px; font-weight: 600; }
  .neo-go:hover { background: #019bc5; }
  .neo-x { background: none; border: 1px solid #445; color: #999; border-radius: 5px; padding: 4px 10px; cursor: pointer; font-size: 11px; }
  .neo-x:hover { color: #fff; border-color: #666; }
  .neo-cd { color: #888; font-size: 11px; margin-left: auto; }

  /* ── Error ─────────────────────────────────────────── */
  .error-overlay {
    position: absolute; inset: 0; z-index: 5;
    background: rgba(0,0,0,.85); display: flex;
    align-items: center; justify-content: center;
    flex-direction: column; color: #ff6b6b; text-align: center;
    padding: 24px; font-size: 14px; line-height: 1.8;
  }
  .error-overlay a { color: #01b4e4; }
  .error-overlay input {
    width: 90%; margin-top: 8px; padding: 8px;
    background: #1a2a3a; color: #fff; border: 1px solid #2a4a6a;
    border-radius: 6px; font-size: 12px;
  }
</style>
</head>
<body>
<div class="player-root">
  <video-js id="vid" class="vjs-big-play-centered" preload="auto">
    <p class="vjs-no-js">Enable JavaScript to use the player.</p>
  </video-js>
  <div class="title-bar" id="titleBar"></div>
  <div class="progress-row" id="progressRow">
    <div class="progress-track">
      <div class="progress-buffered" id="pBuf"></div>
      <div class="progress-filled" id="pFill"></div>
      <div class="progress-dot" id="pDot"></div>
    </div>
  </div>
  <div class="ctrl-bar" id="ctrlBar"></div>
</div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/videojs-contrib-quality-levels@4/dist/videojs-contrib-quality-levels.min.js"></script>
<script>
(function() {
  var P = new URLSearchParams(window.location.search);
  var streamUrl = P.get('url') || '';
  var title     = P.get('title') || '';
  var proxyPort = P.get('proxy') || '8513';
  var proxyBase = 'http://127.0.0.1:' + proxyPort + '/';
  if (!streamUrl) return;

  var playlist = null, currentIdx = -1;
  try {
    var h = window.location.hash.substring(1);
    if (h) { playlist = JSON.parse(atob(decodeURIComponent(h))); currentIdx = playlist.current || 0; }
  } catch(e) {}

  /* ── Video.js — minimal, no built-in control bar ──── */
  var player = videojs('vid', {
    controls: false, fluid: false, responsive: false,
    playbackRates: [0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2],
    html5: {
      vhs: { overrideNative: true, enableLowInitialPlaylist: false },
      nativeAudioTracks: false, nativeVideoTracks: false
    }
  });

  var bar = document.getElementById('ctrlBar');
  var titleBar = document.getElementById('titleBar');
  titleBar.textContent = title || 'Player';

  /* ── SVG icons ─────────────────────────────────────── */
  var IC = {
    play:  '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
    pause: '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>',
    prev:  '<svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>',
    rew:   '<svg viewBox="0 0 24 24"><path d="M11.99 5V1l-5 5 5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6h-2c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/><text x="12" y="15.5" text-anchor="middle" font-size="7" fill="currentColor" font-weight="700">10</text></svg>',
    fwd:   '<svg viewBox="0 0 24 24"><path d="M12.01 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/><text x="12" y="15.5" text-anchor="middle" font-size="7" fill="currentColor" font-weight="700">10</text></svg>',
    next:  '<svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>',
    vol:   '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>',
    mute:  '<svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>',
    pip:   '<svg viewBox="0 0 24 24"><path d="M19 7h-8v6h8V7zm2-4H3c-1.1 0-2 .9-2 2v14c0 1.1.9 1.98 2 1.98h18c1.1 0 2-.88 2-1.98V5c0-1.1-.9-2-2-2zm0 16.01H3V4.98h18v14.03z"/></svg>',
    fs:    '<svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>'
  };

  /* ── Build control bar ─────────────────────────────── */
  function cb(cls, html, tip, fn) {
    var d = document.createElement('div');
    d.className = 'cb ' + cls;
    d.innerHTML = html;
    if (tip) d.title = tip;
    if (fn) d.addEventListener('click', fn);
    bar.appendChild(d);
    return d;
  }

  var btnPlay = cb('', IC.play, 'Play/Pause', function() { player.paused() ? player.play() : player.pause(); });
  var btnPrev = cb('', IC.prev, 'Previous Episode', function() { loadEpisode(currentIdx - 1); });
  cb('', IC.rew, 'Back 10s', function() { player.currentTime(Math.max(0, player.currentTime() - 10)); });
  cb('', IC.fwd, 'Forward 10s', function() { player.currentTime(Math.min(player.duration()||0, player.currentTime() + 10)); });
  var btnNext = cb('', IC.next, 'Next Episode', function() { loadEpisode(currentIdx + 1); });

  var volBtn = cb('', IC.vol, 'Mute', function() { player.muted(!player.muted()); });
  var timeEl = document.createElement('div');
  timeEl.className = 'time';
  timeEl.textContent = '0:00 / 0:00';
  bar.appendChild(timeEl);

  var spacer = document.createElement('div');
  spacer.className = 'spacer';
  bar.appendChild(spacer);

  var audioPill  = mkPill('audio');
  var qualPill   = mkPill('quality');
  var speedPill  = mkPill('speed');

  cb('', IC.pip, 'Picture-in-Picture', function() {
    var ve = player.tech_ && player.tech_.el_;
    if (!ve) return;
    document.pictureInPictureElement ? document.exitPictureInPicture() : ve.requestPictureInPicture().catch(function(){});
  });
  cb('', IC.fs, 'Fullscreen', function() {
    player.isFullscreen() ? player.exitFullscreen() : player.requestFullscreen();
  });

  /* Show/hide prev/next based on playlist */
  function updateNavBtns() {
    btnPrev.style.display = (playlist && currentIdx > 0) ? '' : 'none';
    btnNext.style.display = (playlist && getNextEp()) ? '' : 'none';
  }
  updateNavBtns();

  /* ── Pill dropdown factory ─────────────────────────── */
  function mkPill(id) {
    var wrap = document.createElement('div');
    wrap.className = 'cb pill';
    wrap.id = 'pill-' + id;
    wrap.innerHTML = '<span class="pv">–</span><div class="pill-dropdown"></div>';
    wrap.addEventListener('click', function(e) {
      e.stopPropagation();
      closeAllPills(wrap);
      wrap.classList.toggle('open');
    });
    bar.appendChild(wrap);
    return wrap;
  }

  function setPillValue(pill, text) {
    pill.querySelector('.pv').textContent = text;
  }

  function setPillItems(pill, header, items) {
    var dd = pill.querySelector('.pill-dropdown');
    dd.innerHTML = '';
    if (header) {
      var h = document.createElement('div');
      h.className = 'pd-header';
      h.textContent = header;
      dd.appendChild(h);
    }
    items.forEach(function(it) {
      var d = document.createElement('div');
      d.className = 'pd-item' + (it.active ? ' active' : '');
      d.textContent = it.label;
      d.addEventListener('click', function(e) {
        e.stopPropagation();
        it.fn(d);
        dd.querySelectorAll('.pd-item').forEach(function(m) { m.classList.remove('active'); });
        d.classList.add('active');
        pill.classList.remove('open');
      });
      dd.appendChild(d);
    });
  }

  function closeAllPills(except) {
    document.querySelectorAll('.pill.open').forEach(function(p) {
      if (p !== except) p.classList.remove('open');
    });
  }
  document.addEventListener('click', function() { closeAllPills(null); });

  /* ── Speed pill ────────────────────────────────────── */
  setPillValue(speedPill, '1x');
  setPillItems(speedPill, 'Speed', [0.25,0.5,0.75,1,1.25,1.5,1.75,2].map(function(r) {
    return { label: r + 'x', active: r === 1, fn: function() {
      player.playbackRate(r);
      setPillValue(speedPill, r + 'x');
    }};
  }));

  /* ── Quality pill ──────────────────────────────────── */
  var ql = player.qualityLevels ? player.qualityLevels() : null;
  function rebuildQuality() {
    if (!ql || ql.length === 0) { setPillValue(qualPill, 'Auto'); return; }
    var lvls = [], seen = {};
    for (var i = 0; i < ql.length; i++) {
      var h = ql[i].height;
      if (h && !seen[h]) { seen[h] = true; lvls.push(h); }
    }
    lvls.sort(function(a,b) { return b - a; });
    if (lvls.length <= 1) { setPillValue(qualPill, lvls[0] ? lvls[0]+'p' : 'Auto'); return; }

    var items = [{ label: 'Auto', active: true, fn: function() {
      for (var j = 0; j < ql.length; j++) ql[j].enabled = true;
      setPillValue(qualPill, 'Auto');
    }}];
    lvls.forEach(function(h) {
      items.push({ label: h + 'p', active: false, fn: function() {
        for (var j = 0; j < ql.length; j++) ql[j].enabled = (ql[j].height === h);
        setPillValue(qualPill, h + 'p');
      }});
    });
    setPillItems(qualPill, 'Quality', items);
    setPillValue(qualPill, 'Auto');
  }
  if (ql) ql.on('addqualitylevel', debounce(rebuildQuality, 600));
  setPillValue(qualPill, 'Auto');

  /* ── Audio pill ────────────────────────────────────── */
  var audioBuilt = false;
  function friendlyTrackName(track, idx) {
    var raw = track.label || track.language || '';
    if (!raw || /^(stream|audio)[_\-]?\d*$/i.test(raw)) {
      var apiLangs = (playlist && playlist.episodes && currentIdx >= 0)
        ? (playlist.episodes[currentIdx].langs || []) : [];
      return apiLangs[idx] || apiLangs[0] || 'Default';
    }
    return raw;
  }

  function rebuildAudio() {
    if (audioBuilt) return;
    var tracks = player.audioTracks();
    var n = tracks ? tracks.length : 0;
    var apiLangs = (playlist && playlist.episodes && currentIdx >= 0) ? (playlist.episodes[currentIdx].langs || []) : [];

    if (n > 1) {
      audioBuilt = true;
      var items = [];
      var current = 'Default';
      for (var i = 0; i < tracks.length; i++) {
        (function(idx) {
          var t = tracks[idx];
          var nm = friendlyTrackName(t, idx);
          if (t.enabled) current = nm;
          items.push({ label: nm, active: t.enabled, fn: function() {
            for (var j = 0; j < tracks.length; j++) tracks[j].enabled = (j === idx);
            setPillValue(audioPill, nm);
          }});
        })(i);
      }
      setPillItems(audioPill, 'Audio Language', items);
      setPillValue(audioPill, current);
    } else {
      var lang = 'Default';
      if (n === 1) lang = friendlyTrackName(tracks[0], 0);
      else if (apiLangs.length > 0) lang = apiLangs.join(', ');
      setPillValue(audioPill, lang);
      audioBuilt = true;
    }
  }
  player.on('loadedmetadata', function() {
    rebuildAudio();
    setTimeout(rebuildAudio, 1000);
    setTimeout(rebuildAudio, 3000);
  });
  player.on('loadeddata', rebuildAudio);
  var at = player.audioTracks();
  if (at) { at.addEventListener('addtrack', rebuildAudio); }

  /* ── Play/pause state ──────────────────────────────── */
  player.on('play',  function() { btnPlay.innerHTML = IC.pause; });
  player.on('pause', function() { btnPlay.innerHTML = IC.play; });
  player.on('volumechange', function() {
    volBtn.innerHTML = player.muted() || player.volume() === 0 ? IC.mute : IC.vol;
  });

  /* ── Time display ──────────────────────────────────── */
  player.on('timeupdate', function() {
    timeEl.textContent = fmt(player.currentTime()) + ' / ' + fmt(player.duration());
  });
  function fmt(s) {
    if (!s || !isFinite(s)) return '0:00';
    var m = Math.floor(s / 60), sec = Math.floor(s % 60);
    var hr = Math.floor(m / 60);
    if (hr > 0) { m = m % 60; return hr + ':' + pad(m) + ':' + pad(sec); }
    return m + ':' + pad(sec);
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  /* ── Custom progress bar ───────────────────────────── */
  var pRow = document.getElementById('progressRow');
  var pFill = document.getElementById('pFill');
  var pBuf  = document.getElementById('pBuf');
  var pDot  = document.getElementById('pDot');
  var seeking = false;

  player.on('timeupdate', function() {
    if (seeking) return;
    var pct = player.duration() ? (player.currentTime() / player.duration()) * 100 : 0;
    pFill.style.width = pct + '%';
    pDot.style.left = pct + '%';
  });
  player.on('progress', function() {
    var buf = player.buffered();
    if (buf.length) {
      pBuf.style.width = (buf.end(buf.length - 1) / (player.duration() || 1)) * 100 + '%';
    }
  });

  function seekFromEvent(e) {
    var rect = pRow.getBoundingClientRect();
    var pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    player.currentTime(pct * (player.duration() || 0));
    pFill.style.width = (pct * 100) + '%';
    pDot.style.left = (pct * 100) + '%';
  }
  pRow.addEventListener('mousedown', function(e) { seeking = true; seekFromEvent(e); });
  document.addEventListener('mousemove', function(e) { if (seeking) seekFromEvent(e); });
  document.addEventListener('mouseup', function() { seeking = false; });
  pRow.addEventListener('click', seekFromEvent);

  /* ── Click video to play/pause, dblclick fullscreen ── */
  player.on('click', function() { player.paused() ? player.play() : player.pause(); });
  player.on('dblclick', function() {
    player.isFullscreen() ? player.exitFullscreen() : player.requestFullscreen();
  });

  /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
     Next / Previous Episode
     ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
  var nextOverlay = null, cdTimer = null, nextShown = false;

  function getNextEp() {
    if (!playlist || !playlist.episodes) return null;
    var ni = currentIdx + 1;
    return ni < playlist.episodes.length ? playlist.episodes[ni] : null;
  }

  function showNextOverlay(ep) {
    if (nextOverlay) return;
    nextShown = true;
    var cd = 15;
    nextOverlay = document.createElement('div');
    nextOverlay.className = 'next-ep-overlay';
    nextOverlay.innerHTML =
      '<div class="neo-lbl">Up Next</div>' +
      '<div class="neo-ttl">' + esc(ep.title) + '</div>' +
      '<div class="neo-acts">' +
        '<button class="neo-go">Play Now</button>' +
        '<button class="neo-x">Cancel</button>' +
        '<span class="neo-cd">' + cd + 's</span>' +
      '</div>';
    document.querySelector('.player-root').appendChild(nextOverlay);
    nextOverlay.querySelector('.neo-go').onclick = function(e) { e.stopPropagation(); loadEpisode(currentIdx+1); };
    nextOverlay.querySelector('.neo-x').onclick  = function(e) { e.stopPropagation(); hideNextOverlay(); };
    cdTimer = setInterval(function() {
      cd--;
      var el = nextOverlay ? nextOverlay.querySelector('.neo-cd') : null;
      if (el) el.textContent = cd + 's';
      if (cd <= 0) loadEpisode(currentIdx + 1);
    }, 1000);
  }

  function hideNextOverlay() {
    if (cdTimer) { clearInterval(cdTimer); cdTimer = null; }
    if (nextOverlay) { nextOverlay.remove(); nextOverlay = null; }
  }

  player.on('timeupdate', function() {
    if (nextShown) return;
    var nxt = getNextEp();
    if (!nxt) return;
    var dur = player.duration(), rem = dur - player.currentTime();
    if (dur > 0 && rem <= 60 && rem > 0) showNextOverlay(nxt);
  });
  player.on('ended', function() { if (getNextEp()) loadEpisode(currentIdx + 1); });

  function loadEpisode(idx) {
    if (!playlist || idx < 0 || idx >= playlist.episodes.length) return;
    hideNextOverlay();
    nextShown = false;
    audioBuilt = false;
    currentIdx = idx;
    var ep = playlist.episodes[idx];
    titleBar.textContent = ep.title;
    updateNavBtns();
    setPillValue(audioPill, 'Default');
    setPillValue(qualPill, 'Auto');
    player.src({ src: proxyBase + ep.url, type: 'application/x-mpegURL' });
    player.play().catch(function(){});
  }

  /* ── Keyboard shortcuts ────────────────────────────── */
  document.addEventListener('keydown', function(e) {
    if (e.target.tagName === 'INPUT') return;
    var ok = true;
    switch (e.key.toLowerCase()) {
      case ' ': case 'k': player.paused() ? player.play() : player.pause(); break;
      case 'arrowleft': case 'j': player.currentTime(Math.max(0, player.currentTime() - 10)); break;
      case 'arrowright': case 'l': player.currentTime(Math.min(player.duration()||0, player.currentTime() + 10)); break;
      case 'arrowup':   player.volume(Math.min(1, player.volume() + 0.05)); break;
      case 'arrowdown': player.volume(Math.max(0, player.volume() - 0.05)); break;
      case 'f': player.isFullscreen() ? player.exitFullscreen() : player.requestFullscreen(); break;
      case 'm': player.muted(!player.muted()); break;
      case 'n': if (getNextEp()) loadEpisode(currentIdx + 1); break;
      case 'b': if (playlist && currentIdx > 0) loadEpisode(currentIdx - 1); break;
      case 'p':
        var ve = player.tech_ && player.tech_.el_;
        if (ve) { document.pictureInPictureElement ? document.exitPictureInPicture() : ve.requestPictureInPicture().catch(function(){}); }
        break;
      default: ok = false;
    }
    if (ok) e.preventDefault();
  });

  /* ── Error ─────────────────────────────────────────── */
  player.on('error', function() {
    var r = document.querySelector('.player-root');
    if (r.querySelector('.error-overlay')) return;
    var d = document.createElement('div');
    d.className = 'error-overlay';
    d.innerHTML = '<div>Cannot play stream.<br><a href="'+streamUrl+'" target="_blank">Open in browser</a>' +
      '<br>Or copy URL for VLC/mpv:<br><input value="'+streamUrl.replace(/"/g,'&quot;')+'" onclick="this.select()" readonly></div>';
    r.appendChild(d);
  });

  /* ── Load ──────────────────────────────────────────── */
  player.src({ src: proxyBase + streamUrl, type: 'application/x-mpegURL' });
  player.ready(function() { player.play().catch(function(){}); });

  /* ── Util ──────────────────────────────────────────── */
  function debounce(fn, ms) { var t; return function() { clearTimeout(t); t = setTimeout(fn, ms); }; }
  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
})();
</script>
</body>
</html>
